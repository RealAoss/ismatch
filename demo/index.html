<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ismatch - Arabic name matching demo</title>
<style>
  :root { --bg:#f6f4ef; --card:#fff; --ink:#1d2a2c; --muted:#6a7577; --line:#e3ded3; --accent:#0f766e;
          --good:#0f766e; --mid:#b7791f; --bad:#b4382c; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12191a; --card:#1b2526; --ink:#e8eceb; --muted:#98a5a6; --line:#2c3a3b; --accent:#3fc1b4;
            --good:#3fc1b4; --mid:#e0b25a; --bad:#ef7d70; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font: 16px/1.5 system-ui, "Segoe UI", Tahoma, "Noto Sans Arabic", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 40px 16px 64px; }
  h1 { font-size: 30px; margin: 0 0 4px; letter-spacing: -.01em; }
  h1 span { color: var(--accent); }
  .sub { color: var(--muted); margin: 0 0 28px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 560px) { .row { grid-template-columns: 1fr; } }
  label { display:block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  input { width:100%; font: inherit; font-size: 20px; padding: 10px 12px; color: var(--ink);
          background: var(--bg); border: 1px solid var(--line); border-radius: 10px; }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin: 16px 0 0; }
  .chips button { font: inherit; font-size: 13px; padding: 5px 10px; border-radius: 999px; cursor: pointer;
                  background: transparent; color: var(--ink); border: 1px solid var(--line); }
  .chips button:hover { border-color: var(--accent); color: var(--accent); }
  #out { margin-top: 20px; min-height: 150px; }
  .score { display:flex; align-items: baseline; gap: 12px; }
  .score b { font-size: 44px; font-variant-numeric: tabular-nums; line-height: 1; }
  .score em { font-style: normal; font-weight: 600; }
  .bar { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; margin: 12px 0 16px; }
  .bar i { display:block; height:100%; border-radius: 99px; transition: width .2s; }
  table { width:100%; border-collapse: collapse; font-size: 15px; }
  td { padding: 7px 4px; border-top: 1px solid var(--line); }
  td:last-child { text-align: end; font-variant-numeric: tabular-nums; color: var(--muted); width: 60px; }
  td.sep { color: var(--muted); width: 28px; text-align:center; }
  .note { color: var(--muted); font-size: 14px; margin: 10px 0 0; }
  .muted { color: var(--muted); }
  footer { margin-top: 24px; color: var(--muted); font-size: 14px; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1><span>is</span>match</h1>
  <p class="sub">Do two spellings refer to the same Arabic name? &nbsp;·&nbsp; <span dir="rtl" lang="ar">هل الاسمان لشخص واحد؟</span></p>

  <div class="card">
    <div class="row">
      <div><label for="a">Name A &nbsp;·&nbsp; الاسم الأول</label><input id="a" dir="auto" autocomplete="off" value="محمد عبد الرحمن الخطيب"></div>
      <div><label for="b">Name B &nbsp;·&nbsp; الاسم الثاني</label><input id="b" dir="auto" autocomplete="off" value="Dr. Mohamed Abdelrahman Al-Khatib"></div>
    </div>
    <div class="chips" id="chips"></div>
    <div id="out"><p class="muted">Loading Python in your browser (first visit takes a few seconds)…</p></div>
  </div>

  <footer>
    Everything runs locally in this page: the real Python library, compiled to WebAssembly with Pyodide. No name you type leaves your browser.
  </footer>
</main>

<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
<script>
const EXAMPLES = [
  ["محمد", "Mohammed"], ["حسن", "Hussein"], ["عبدالرحمن", "Abd al-Rahman"], ["Abdul Rahman", "Abdul Rahim"],
  ["القذافي", "Gaddafi"], ["מוחמד עלי", "محمد علي"], ["Hassan, Mohamed Ali", "محمد علي حسن"],
  ["منير", "منيرة"], ["صلاح الدين", "Salahuddin"], ["Fathi", "فتحي"],
];
const FILES = ["__init__", "phonemes", "distance", "lexicon", "parse", "match", "index"];
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let compare = null;

const chips = $("chips");
EXAMPLES.forEach(([x, y]) => {
  const b = document.createElement("button");
  b.textContent = x + "  ·  " + y;
  b.dir = "auto";
  b.onclick = () => { $("a").value = x; $("b").value = y; render(); };
  chips.appendChild(b);
});

function render() {
  if (!compare) return;
  const r = JSON.parse(compare($("a").value, $("b").value));
  const color = r.score >= 0.85 ? "var(--good)" : r.score >= 0.7 ? "var(--mid)" : "var(--bad)";
  const verdict = { strong: "Same name · نفس الاسم", probable: "Probably the same · على الأرجح نفس الاسم",
                    possible: "Possible, needs review · محتمل، يحتاج مراجعة", no: "Different · مختلفان" }[r.level];
  let rows = r.pairs.map(p => `<tr><td dir="auto">${esc(p.a)}</td><td class="sep">~</td><td dir="auto">${esc(p.b)}</td><td>${p.score.toFixed(2)}</td></tr>`).join("");
  const extra = [];
  if (r.unmatched_a.length) extra.push("Only in A: " + r.unmatched_a.map(esc).join(", "));
  if (r.unmatched_b.length) extra.push("Only in B: " + r.unmatched_b.map(esc).join(", "));
  if (r.reordered) extra.push("Name parts appear in a different order.");
  $("out").innerHTML =
    `<div class="score"><b style="color:${color}">${r.score.toFixed(2)}</b><em style="color:${color}">${verdict}</em></div>
     <div class="bar"><i style="width:${Math.round(r.score * 100)}%;background:${color}"></i></div>
     ${rows ? `<table>${rows}</table>` : `<p class="muted">Type two names to compare them.</p>`}
     ${extra.map(e => `<p class="note" dir="auto">${e}</p>`).join("")}`;
}

(async () => {
  try {
    const py = await loadPyodide();
    py.FS.mkdirTree("/lib/ismatch");
    await Promise.all(FILES.map(async f => {
      const res = await fetch(`../src/ismatch/${f}.py`);
      if (!res.ok) throw new Error(`cannot load ${f}.py (${res.status})`);
      py.FS.writeFile(`/lib/ismatch/${f}.py`, await res.text());
    }));
    py.runPython(`
import sys, json
sys.path.insert(0, "/lib")
import ismatch
def _cmp(a, b):
    return json.dumps(ismatch.compare(a, b).to_dict(), ensure_ascii=False)
`);
    compare = py.globals.get("_cmp");
    $("a").oninput = $("b").oninput = render;
    render();
  } catch (e) {
    $("out").innerHTML = `<p class="note">Could not start the demo: ${esc(String(e))}. Serve the repository root over HTTP (e.g. <code>python -m http.server</code>) and open <code>/demo/</code>.</p>`;
  }
})();
</script>
</body>
</html>
